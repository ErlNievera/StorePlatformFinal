openapi: 3.0.3
info:
  title: Store Platform - Payment API
  version: "1.0"
  description: |
    Charges and refunds for orders, plus an on-demand failure switch for saga demos.

    Payments are created by the order saga through RabbitMQ events
    (`ChargePaymentRequested`, `RefundPaymentRequested`); this HTTP API exposes
    payment lookups and the admin failure mode. When the failure mode is
    `DeclineCharge`, every new charge is declined and a `PaymentFailed` event is
    published, which makes the saga release stock and cancel the order. Changing the
    mode takes effect immediately, without code edits or restarts.

    Paths are relative to a server URL that already contains the API version:
    the service serves them under `/api/v1`, and the gateway exposes them under
    `/payments/v1`.

    Correlation: clients may send an `X-Correlation-ID` request header (the gateway
    always sets one). The service reuses it, or generates one when it is missing,
    and returns it in the `X-Correlation-ID` response header. Every error response
    is an RFC 7807 Problem Details document carrying the same value in a
    `correlationId` extension.
  contact:
    name: Erl Lorence Nievera
servers:
  - url: http://localhost:5000/payments/v1
    description: Through the Ocelot gateway (the only entry point for clients)
  - url: http://localhost:5005/api/v1
    description: Payment.Api directly (development Swagger only)
security:
  - bearerAuth: []
tags:
  - name: Payments
    description: Charges and refunds recorded for orders
  - name: Admin
    description: Failure switch used to demonstrate saga compensation
paths:
  /payments:
    get:
      tags: [Payments]
      operationId: listPayments
      summary: List the most recent payments
      description: Admin only. Newest first.
      parameters:
        - name: take
          in: query
          required: false
          description: Maximum number of payments to return
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Payments, newest first
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /payments/orders/{orderId}:
    get:
      tags: [Payments]
      operationId: getPaymentByOrder
      summary: Get the payment recorded for an order
      description: Admin only. Returns 404 when no charge has been attempted for the order yet.
      parameters:
        - name: orderId
          in: path
          required: true
          description: Order id assigned by Order.Api
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment for the order
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/failure-mode:
    get:
      tags: [Admin]
      operationId: getPaymentFailureMode
      summary: Read the current payment failure mode
      description: Admin only.
      responses:
        '200':
          description: Current failure mode
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentFailureModeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [Admin]
      operationId: setPaymentFailureMode
      summary: Switch the payment failure mode
      description: |
        Admin only. `DeclineCharge` declines every new charge until the mode is set back to `None`.
        Refunds are never affected, so compensation always completes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentFailureModeRequest'
            example:
              mode: DeclineCharge
      responses:
        '200':
          description: Failure mode after the change
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentFailureModeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by Identity. Every Payment endpoint requires the `Admin` role.
  headers:
    CorrelationId:
      description: Correlation id of the request (echoed or generated)
      schema:
        type: string
  responses:
    BadRequest:
      description: The request is malformed or fails validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
    Unauthorized:
      description: No valid bearer token was supplied
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: The caller is authenticated but lacks the Admin role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: No payment exists for the order
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: Payment.Api or its database is unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    PaymentStatus:
      type: string
      description: |
        `Charged` - money was taken. `Declined` - the charge was refused (no money taken).
        `Refunded` - a previous charge was returned during compensation.
      enum: [Charged, Declined, Refunded]
    Payment:
      type: object
      required: [paymentId, orderId, customerId, amount, currency, status, createdAt, updatedAt]
      properties:
        paymentId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        amount:
          type: number
          format: decimal
          minimum: 0
          description: Order total charged, taken from the price snapshot on the order lines
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 code
          example: PHP
        status:
          $ref: '#/components/schemas/PaymentStatus'
        failureReason:
          type: string
          nullable: true
          maxLength: 500
          description: Why the charge was declined
        refundReason:
          type: string
          nullable: true
          maxLength: 500
          description: Why the charge was refunded
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        paymentId: 7d1e2f30-5a6b-4c7d-8e9f-0a1b2c3d4e5f
        orderId: 1b2c3d4e-5f60-4718-293a-4b5c6d7e8f90
        customerId: 0f9e8d7c-6b5a-4938-2716-05f4e3d2c1b0
        amount: 1499.50
        currency: PHP
        status: Charged
        failureReason: null
        refundReason: null
        createdAt: '2026-11-13T08:00:00Z'
        updatedAt: '2026-11-13T08:00:00Z'
    PaymentFailureMode:
      type: string
      enum: [None, DeclineCharge]
    PaymentFailureModeRequest:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/PaymentFailureMode'
    PaymentFailureModeResponse:
      type: object
      required: [mode, updatedAt]
      properties:
        mode:
          $ref: '#/components/schemas/PaymentFailureMode'
        updatedAt:
          type: string
          format: date-time
          description: When the mode was last changed (service start time if never changed)
    ProblemDetails:
      type: object
      description: RFC 7807 problem document with the request's correlation id
      required: [title, status, correlationId]
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
        correlationId:
          type: string
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
